; PlatformIO Project Configuration File
;
; https://docs.platformio.org/page/projectconf.html

[env:nanoatmega328]
platform = atmelavr
board = nanoatmega328
framework = arduino

lib_deps =
    adafruit/Adafruit SSD1306
    adafruit/Adafruit GFX Library
    adafruit/Adafruit BusIO

board_build.cpp_std = gnu++17
build_flags = -std=gnu++17

; Раскомментируйте при необходимости явного порта:
; upload_port = COM5
; upload_port = /dev/ttyUSB0
upload_speed = 57600
; Скорость Serial Monitor (по умолчанию PIO = 9600, в прошивке — 115200)
monitor_speed = 115200
