; PlatformIO Project Configuration File
;
; https://docs.platformio.org/page/projectconf.html
;
; Nano с CH340: чаще всего загрузчик Optiboot (новый) → env nanoatmega328new.
; Если avrdude: stk500_getsync — попробуйте второй env (см. README).

[platformio]
default_envs = nanoatmega328

[env]
platform = atmelavr
framework = arduino

lib_deps =
    adafruit/Adafruit SSD1306
    adafruit/Adafruit GFX Library
    adafruit/Adafruit BusIO

; AVR toolchain по умолчанию gnu++11; Config.h использует static constexpr (без C++17).
board_build.cpp_std = gnu++11

monitor_speed = 115200

; Явный порт (Windows: COM8; Linux: /dev/ttyUSB0 или ttyACM0)
upload_port = COM9
monitor_port = COM9

; --- Новый загрузчик Optiboot (115200) — большинство клонов с CH340 -------
[env:nanoatmega328]
board = nanoatmega328new
upload_speed = 115200
