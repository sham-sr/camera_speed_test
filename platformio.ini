; PlatformIO — STM32F103C8 «Blue Pill»
;
; https://docs.platformio.org/page/projectconf.html

[env:bluepill_f103c8]
platform = ststm32
board = bluepill_f103c8
framework = arduino

lib_deps =
    adafruit/Adafruit ST7735 and ST7789 Library
    adafruit/Adafruit GFX Library
    adafruit/Adafruit BusIO

board_build.cpp_std = gnu++17
build_unflags = -std=gnu++11

; ST-Link — типичная прошивка Blue Pill. Для UART/DFU замените upload_protocol.
upload_protocol = stlink
monitor_speed = 115200

; Раскомментируйте и укажите порт USB‑UART (USART2: PA2/PA3), если нужен явный monitor_port.
; monitor_port = /dev/ttyUSB0
