; PlatformIO Project Configuration File
;
; https://docs.platformio.org/page/projectconf.html
;
; Nano с CH340: чаще всего загрузчик Optiboot (новый) → env nanoatmega328new.
; Если avrdude: stk500_getsync — попробуйте второй env (см. README).

[platformio]
default_envs = nanoatmega328new

[env]
platform = atmelavr
framework = arduino

lib_deps =
    adafruit/Adafruit SSD1306
    adafruit/Adafruit GFX Library
    adafruit/Adafruit BusIO

board_build.cpp_std = gnu++17
build_flags = -std=gnu++17

monitor_speed = 115200

; Явный порт (раскомментируйте, если авто-выбор не тот):
; upload_port = /dev/ttyUSB1
; monitor_port = /dev/ttyUSB1

; --- Старый загрузчик (ATmegaBOOT, 57600) — редкие старые Nano -----------
[env:nanoatmega328]
board = nanoatmega328
upload_speed = 57600

; --- Новый загрузчик Optiboot (115200) — большинство клонов с CH340 -------
[env:nanoatmega328new]
board = nanoatmega328new
upload_speed = 115200
